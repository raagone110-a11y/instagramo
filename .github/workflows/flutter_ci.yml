name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Code checkout karo
      - uses: actions/checkout@v4

      # 2. Flutter setup karo
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # 3. Dependencies install karo
      - name: Get dependencies
        run: flutter pub get

      # 4. Code formatting check karo
      - name: Check formatting
        run: dart format --set-exit-if-changed .

      # 5. Static analysis karo
      - name: Analyze code
        run: flutter analyze

      # 6. Tests run karo
      - name: Run tests
        run: flutter test

      # 7. APK build karo (Android)
      - name: Build APK
        run: flutter build apk --release

      # 8. Upload APK as artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
