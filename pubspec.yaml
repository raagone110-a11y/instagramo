name: instagramo
description: A modern social media application built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3

  # Auth & Sign-in
  google_sign_in: ^6.2.1

  # Media
  image_picker: ^1.1.2
  video_player: ^2.9.2
  cached_network_image: ^3.4.1

  # Location
  geolocator: ^13.0.2

  # UI Components
  shimmer: ^3.0.0

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Local Storage
  shared_preferences: ^2.3.3

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  flutter_animate: ^4.5.2
  equatable: ^2.1.0
  pin_code_fields: ^9.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
